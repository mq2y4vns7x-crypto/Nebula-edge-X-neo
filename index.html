<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula AI | Stratospheric Intelligence</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.2.12/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="app-container">
      <div class="sidebar">
        <div class="logo">
          <i class="fas fa-user-astronaut"></i>
          <span>Nebula AI</span>
        </div>
        <button id="new-chat" class="new-chat-btn">
          <i class="fas fa-plus"></i>
          <span>New Chat</span>
        </button>
        <div class="history-container">
          <h3>Chat History</h3>
          <div id="chat-history"></div>
        </div>
        <div class="settings">
          <button id="clear-history"><i class="fas fa-trash"></i><span>Clear All</span></button>
          <button id="toggle-theme"><i class="fas fa-moon"></i><span>Theme</span></button>
        </div>
      </div>

      <div class="main-content">
        <div class="chat-header">
          <h2 id="current-chat-title">New Conversation</h2>
          <div class="header-actions">
            <button id="stop-response" style="display: none;"><i class="fas fa-stop"></i></button>
            <button id="regenerate-response" style="display: none;"><i class="fas fa-redo"></i></button>
          </div>
        </div>

        <div class="messages" id="messages">
          <div class="intro-message">
            <h1>Nebula Online</h1>
            <p>I have a stratospheric IQ and a razor-sharp edge. Ask something worthy of my time.</p>
            <div class="suggestion-chips">
              <button class="suggestion-chip">Explain Quantum Physics with puns</button>
              <button class="suggestion-chip">Roast my JavaScript skills</button>
              <button class="suggestion-chip">Solve a logic paradox</button>
            </div>
          </div>
        </div>

        <div class="input-area">
          <div class="input-container">
            <textarea id="user-input" placeholder="Consult the oracle..." rows="1"></textarea>
            <button id="send-button"><i class="fas fa-paper-plane"></i></button>
          </div>
          <div class="disclaimer">Nebula is elite, but double-check my math. Stored locally.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
