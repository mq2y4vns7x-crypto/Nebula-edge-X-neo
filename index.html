<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula edge AI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.2.12/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="app-container">
      <div class="sidebar">
        <div class="logo">
          <i class="fas fa-robot"></i>
          <span>Nebula edge</span>
        </div>
        <button id="new-chat" class="new-chat-btn">
          <i class="fas fa-plus"></i>
          <span>New Chat</span>
        </button>
        <div class="history-container">
          <h3>Chat History</h3>
          <div id="chat-history"></div>
        </div>
        <div class="settings">
          <button id="clear-history">
            <i class="fas fa-trash"></i>
            <span>Clear History</span>
          </button>
          <button id="toggle-theme">
            <i class="fas fa-moon"></i>
            <span>Toggle Theme</span>
          </button>
          <button id="export-chat">
            <i class="fas fa-download"></i>
            <span>Export Chat</span>
          </button>
        </div>
      </div>
      <div class="main-content">
        <div class="chat-header">
          <h2 id="current-chat-title">New Conversation</h2>
          <div class="header-actions">
            <button id="regenerate-response" title="Regenerate Response" style="display: none;">
              <i class="fas fa-redo"></i>
            </button>
            <button id="stop-response" title="Stop Response" style="display: none;">
              <i class="fas fa-stop"></i>
            </button>
          </div>
        </div>
        <div class="messages" id="messages">
          <div class="intro-message">
            <h1>Welcome to Nebula AI</h1>
            <p>Stratospheric IQ. Razor-sharp wit. Let's solve your problems.</p>
            <div class="suggestion-chips">
              <button class="suggestion-chip">Tell me a story</button>
              <button class="suggestion-chip">Explain quantum computing</button>
              <button class="suggestion-chip">Write a poem</button>
              <button class="suggestion-chip">Help me learn JavaScript</button>
            </div>
          </div>
        </div>
        <div class="input-area">
          <div class="input-container">
            <button id="file-upload-button" title="Upload File">
              <i class="fas fa-paperclip"></i>
            </button>
            <input type="file" id="file-upload" style="display: none" />
            <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
            <button id="send-button" title="Send message">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
          <div id="pending-file-preview"></div>
          <div class="disclaimer">
            Nebula may produce inaccurate information. Messages are stored locally.
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
